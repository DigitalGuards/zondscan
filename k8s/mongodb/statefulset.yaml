apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: zond-explorer
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: zond-explorer
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mongodb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongodb
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: zond-explorer
    spec:
      # Security context - the official mongo image runs as user 999 (mongodb)
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: mongodb
          # 8.2 matches prod. Existing PVCs created by mongo:7 need an FCV
          # step-up (via mongo:8.0) or a wipe + re-sync; see docker-compose.yml.
          image: mongo:8.2
          env:
            # REQUIRED on kernels 6.19+/7.0 with CET user shadow stack: mongod
            # 8.x segfaults ~30s after start with no backtrace (SERVER-120238).
            # Keep as a single token. See docker-compose.yml for the full story.
            - name: GLIBC_TUNABLES
              value: glibc.cpu.hwcaps=-SHSTK
          ports:
            - containerPort: 27017
              name: mongodb
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: mongodb-data
          persistentVolumeClaim:
            claimName: mongodb-pvc
