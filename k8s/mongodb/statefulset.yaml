apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: zond-explorer
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: zond-explorer
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mongodb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongodb
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: zond-explorer
    spec:
      # Security context - the official mongo image runs as user 999 (mongodb)
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: mongodb
          # 8.2 matches prod. Existing PVCs created by mongo:7 need an FCV
          # step-up (via mongo:8.0) or a wipe + re-sync; see docker-compose.yml.
          image: mongo:8.2
          args:
            - --replSet
            - rs0
            - --bind_ip_all
          env:
            # REQUIRED on kernels 6.19+/7.0 with CET user shadow stack: mongod
            # 8.x segfaults ~30s after start with no backtrace (SERVER-120238).
            # Deliberately wipes the image's baked-in glibc.pthread.rseq=0
            # (TCMalloc per-CPU caches off), which also dodges the TCMalloc/rseq
            # crash on the same kernels (SERVER-121912). See docker-compose.yml.
            - name: GLIBC_TUNABLES
              value: glibc.cpu.hwcaps=-SHSTK
          ports:
            - containerPort: 27017
              name: mongodb
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --host
                - 127.0.0.1
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --host
                - 127.0.0.1
                - --eval
                - |
                  const memberHost = "mongodb-0.mongodb.zond-explorer.svc.cluster.local:27017";
                  try {
                    const status = rs.status();
                    const expectedMember = Array.isArray(status.members) && status.members.some(
                      (member) => member.self === true && member.name === memberHost
                    );
                    quit(
                      status.ok === 1 && status.set === "rs0" && status.myState === 1 && expectedMember
                        ? 0
                        : 1
                    );
                  } catch (error) {
                    if (error.code !== 94 && error.codeName !== "NotYetInitialized") {
                      print(error);
                      quit(1);
                    }
                    const result = rs.initiate({
                      _id: "rs0",
                      members: [{
                        _id: 0,
                        host: memberHost
                      }]
                    });
                    if (result.ok !== 1) {
                      printjson(result);
                    }
                    quit(1);
                  }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: mongodb-data
          persistentVolumeClaim:
            claimName: mongodb-pvc
