name: CI

# Only fire on pull requests. Triggering on `push: dev` AND
# `pull_request: [main, dev]` caused every commit on dev to run twice
# (push event + pull_request:synchronize on the open dev,main PR).
# pull_request:synchronize already covers any push to a branch with an
# open PR, and the workflow assumes a dev,main release PR is always
# pending while changes are landing.
on:
  pull_request:
    branches: [main, dev]

# Belt-and-braces dedupe: if two events ever do collide (e.g. a future
# branch protection ruleset opens a second PR for the same head),
# cancel the older run instead of letting both finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ExplorerFrontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ExplorerFrontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  backend:
    name: Backend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backendAPI

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: backendAPI/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -o backendAPI .

  syncer:
    name: Syncer Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: QRL2MongoDB

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: QRL2MongoDB/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -o synchroniser .
