name: CI

# Each change is tested once, on its pull request. A pull request reads caches
# from its base branch and the default branch only, so a push to dev that changes
# dependencies runs the jobs once more to refresh the caches pull requests use.
# The weekly run surfaces drift in the registry and the toolchains.
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]
    paths:
      - 'ExplorerFrontend/package-lock.json'
      - 'backendAPI/go.sum'
      - 'QRL2MongoDB/go.sum'
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# The weekly run tests dev, where changes land first. Scheduled runs read this
# file from main.
env:
  TEST_REF: ${{ github.event_name == 'schedule' && 'dev' || '' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ExplorerFrontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TEST_REF }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ExplorerFrontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: API docs drift check
        run: node scripts/check-api-docs-drift.mjs

      - name: Test
        run: npm test -- --maxWorkers=3

      - name: Build
        run: npm run build

  backend:
    name: Backend Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backendAPI

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TEST_REF }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # setup-go reads the toolchain line, so CI builds with the pinned Go.
          go-version-file: 'backendAPI/go.mod'
          cache-dependency-path: backendAPI/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -o backendAPI .

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      # Hermetic by contract: no MONGOURI, no .env, no network. Integration
      # tests stay behind the //go:build integration tag and do not run here.
      - name: Test
        run: go test ./...

  syncer:
    name: Syncer Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: QRL2MongoDB

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TEST_REF }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'QRL2MongoDB/go.mod'
          cache-dependency-path: QRL2MongoDB/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -o synchroniser .

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      # Hermetic by contract: no MONGOURI, no .env, no network. Integration
      # tests stay behind the //go:build integration tag and do not run here.
      - name: Test
        run: go test ./...
