services:
  mongodb:
    image: mongo:7
    container_name: zond-mongodb
    restart: unless-stopped
    environment:
      # mongod 8.x segfaults (exit 139, no backtrace, ~30s after start) on
      # kernels 6.19+/7.0 with CET user shadow stack on Zen 4+/recent Intel:
      # its coroutine stack-pivot trips the hardware ROP protection
      # (SERVER-120238). Harmless on mongo:7; keeps any future image bump to
      # 8.x from resurrecting the July 2026 prod crash-loop.
      - GLIBC_TUNABLES=glibc.cpu.hwcaps=-SHSTK
    ports:
      - "27018:27017"  # Use 27018 externally to avoid conflict with local MongoDB
    volumes:
      - mongodb_data:/data/db
    networks:
      - zond-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backendAPI
      dockerfile: Dockerfile
    container_name: zond-backend
    restart: unless-stopped
    ports:
      - "8082:8080"  # Use 8082 externally to avoid conflict with beacon chain
    environment:
      - MONGOURI=mongodb://mongodb:27017/qrldata-z
      - NODE_URL=http://host.docker.internal:8545
      - HTTP_PORT=:8080
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - zond-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./ExplorerFrontend
      dockerfile: Dockerfile
    container_name: zond-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=mongodb://mongodb:27017/qrldata-z
      - NEXT_PUBLIC_HANDLER_URL=http://backend:8080
      - NEXT_PUBLIC_DOMAIN_NAME=localhost
    depends_on:
      - backend
    networks:
      - zond-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  syncer:
    build:
      context: ./QRL2MongoDB
      dockerfile: Dockerfile
    container_name: zond-syncer
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - MONGOURI=mongodb://mongodb:27017
      - NODE_URL=https://qrlwallet.com/api/zond-rpc/testnet
      - MEMPOOL_NODE_URL=http://host.docker.internal:8545
      - BEACONCHAIN_API=http://host.docker.internal:5051
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - zond-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  zond-network:
    driver: bridge

volumes:
  mongodb_data:
    name: zond-mongodb-data
