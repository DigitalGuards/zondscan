services:
  mongodb:
    # 8.2 matches prod (the explorer box runs 8.2 with data at FCV 8.2).
    # NOTE: an existing local volume created by mongo:7 will not start under
    # 8.2 (FCV too old); wipe it (docker volume rm zond-mongodb-data) and let
    # the syncer re-sync, or step through mongo:8.0 + setFeatureCompatibilityVersion.
    image: mongo:8.2
    container_name: zond-mongodb
    restart: unless-stopped
    environment:
      # REQUIRED on kernels 6.19+/7.0 with CET user shadow stack (Zen 4+/recent
      # Intel): mongod 8.x's coroutine stack-pivot trips the hardware ROP
      # protection and segfaults ~30s after start with no backtrace
      # (SERVER-120238, took down the prod faucet/explorer for a week in July
      # 2026).
      # Side effect (deliberate): this override wipes the image's baked-in
      # GLIBC_TUNABLES=glibc.pthread.rseq=0, so glibc keeps rseq and TCMalloc's
      # per-CPU caches stay off. That costs some throughput but also dodges the
      # separate TCMalloc/rseq crash on kernels 6.19+ (SERVER-121912):
      # restoring rseq=0 alongside -SHSTK was tested on the prod box and mongod
      # kept segfaulting. Once upstream ships a fixed TCMalloc, restore perf
      # with GLIBC_TUNABLES=glibc.cpu.hwcaps=-SHSTK:glibc.pthread.rseq=0.
      - GLIBC_TUNABLES=glibc.cpu.hwcaps=-SHSTK
    ports:
      - "27018:27017"  # Use 27018 externally to avoid conflict with local MongoDB
    volumes:
      - mongodb_data:/data/db
    networks:
      - zond-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backendAPI
      dockerfile: Dockerfile
    container_name: zond-backend
    restart: unless-stopped
    ports:
      - "8082:8080"  # Use 8082 externally to avoid conflict with beacon chain
    environment:
      - MONGOURI=mongodb://mongodb:27017/qrldata-z
      - NODE_URL=http://host.docker.internal:8545
      - HTTP_PORT=:8080
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - zond-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./ExplorerFrontend
      dockerfile: Dockerfile
    container_name: zond-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=mongodb://mongodb:27017/qrldata-z
      - NEXT_PUBLIC_HANDLER_URL=http://backend:8080
      - NEXT_PUBLIC_DOMAIN_NAME=localhost
    depends_on:
      - backend
    networks:
      - zond-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  syncer:
    build:
      context: ./QRL2MongoDB
      dockerfile: Dockerfile
    container_name: zond-syncer
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - MONGOURI=mongodb://mongodb:27017
      - NODE_URL=https://qrlwallet.com/api/zond-rpc/testnet
      - MEMPOOL_NODE_URL=http://host.docker.internal:8545
      - BEACONCHAIN_API=http://host.docker.internal:5051
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - zond-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  zond-network:
    driver: bridge

volumes:
  mongodb_data:
    name: zond-mongodb-data
