name: "zondscan-hypc-v1"
description: "Sealed fd-only Hyperion compiler sandbox"
mode: ONCE
hostname: "zondscan-hypc"
cwd: "/"
time_limit: 30
max_cpus: 1
nice_level: 19
log_level: WARNING
keep_env: false
keep_caps: false
silent: false
skip_setsid: false
stderr_to_null: false
disable_no_new_privs: false
forward_signals: false
disable_tsc: false
rlimit_as: 2048
rlimit_as_type: VALUE
rlimit_core: 0
rlimit_core_type: VALUE
rlimit_cpu: 30
rlimit_cpu_type: VALUE
rlimit_fsize: 0
rlimit_fsize_type: VALUE
rlimit_nofile: 16
rlimit_nofile_type: VALUE
rlimit_nproc: 1
rlimit_nproc_type: VALUE
rlimit_stack: 64
rlimit_stack_type: VALUE
rlimit_memlock: 0
rlimit_memlock_type: VALUE
rlimit_rtprio: 0
rlimit_rtprio_type: VALUE
rlimit_msgqueue: 0
rlimit_msgqueue_type: VALUE
disable_rl: false
clone_newnet: true
clone_newuser: true
clone_newns: true
clone_newpid: true
clone_newipc: true
clone_newuts: true
clone_newcgroup: true
clone_newtime: false
use_cgroupv2: false
detect_cgroupv2: false
uidmap {
  inside_id: "65534"
  outside_id: ""
  count: 1
  use_newidmap: false
}
gidmap {
  inside_id: "65534"
  outside_id: ""
  count: 1
  use_newidmap: false
}
mount_proc: false
mount {
  dst: "/"
  fstype: "tmpfs"
  options: "size=4096,mode=0555"
  rw: false
  is_dir: true
  mandatory: true
  nosuid: true
  nodev: true
  noexec: true
}
seccomp_string: "ALLOW { read { fd == 0 }, write { fd == 1 || fd == 2 }, newfstat { fd <= 2 }, ioctl { fd <= 2 }, brk, mmap { (prot & 0x4) == 0 }, mprotect { (prot & 0x4) == 0 }, munmap, madvise, arch_prctl, set_tid_address, set_robust_list, rseq, prlimit64 { pid == 0 && (resource == 0 || resource == 1 || resource == 3 || resource == 4 || resource == 6 || resource == 7 || resource == 9) }, readlinkat, getrandom, newuname, futex, exit, exit_group, execveat }\nDEFAULT KILL_PROCESS"
seccomp_log: false
iface_no_lo: true
exec_bin {
  path: "/proc/self/fd/4"
  exec_fd: true
}
